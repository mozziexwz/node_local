name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The synced executor tests run the remote shell and Python scripts, so they
  # need Linux, as on the website's CI. The window (package main) is Windows
  # only and is built in the windows job.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Test
        run: go test -count=1 ./internal/... ./installers/... ./cmd/... ./scripts/...

      # The task runner and the stores are used from several goroutines.
      - name: Race detector
        run: go test -count=1 -race ./internal/tasks/... ./internal/servers/... ./internal/store/... ./internal/logx/...

      # The synced files must equal the website release recorded in UPSTREAM.json.
      - name: Check synced files
        run: |
          git clone --quiet --filter=blob:none --no-checkout "$(jq -r .repository UPSTREAM.json).git" "$RUNNER_TEMP/node"
          go run ./scripts/syncnode -check -source "$RUNNER_TEMP/node"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Vet
        run: go vet ./...

      # The runner's %TEMP% contains an 8.3 short name (RUNNER~1). The synced
      # cleanup fixture matches paths by prefix and Python expands short names,
      # so its alias case fails there; runner.temp has no short names.
      - name: Test
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Wails builds with -buildvcs=false, so the version carries the tag or
      # the commit.
      - name: Build MSBOOST-Local (Wails)
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
            $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
            $cfg.info.productVersion = $version.TrimStart('v')
            $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          } else {
            $version = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          wails build -clean -m -platform windows/amd64 -ldflags "-X main.version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'wails build failed' }

      # The portable package: the program, a readme that says where the
      # source is offered, and the licence files. The text files carry the
      # program's name: users unzip it into the launcher's folder, whose own
      # LICENSE.txt, THIRD_PARTY_NOTICES.txt and SHA256SUMS.txt must stay.
      - name: Assemble package
        shell: pwsh
        run: |
          $dir = 'build/release'
          New-Item -ItemType Directory -Force $dir | Out-Null
          go run ./scripts/notices -o "$dir/MSBOOST-Local-THIRD_PARTY_NOTICES.txt"
          if ($LASTEXITCODE -ne 0) { throw 'notices failed' }
          Copy-Item build/bin/MSBOOST-Local.exe $dir/
          Copy-Item LICENSE "$dir/MSBOOST-Local-LICENSE.txt"
          $readme = (Get-Content build/package/README.txt -Raw -Encoding utf8).Replace('{{VERSION}}', $env:VERSION)
          [IO.File]::WriteAllText((Join-Path $PWD "$dir/MSBOOST-Local-README.txt"), $readme.Replace("`r`n", "`n").Replace("`n", "`r`n"))
          (Get-ChildItem $dir -File) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Set-Content "$dir/MSBOOST-Local-SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: MSBOOST-Local-${{ env.VERSION }}-win-x64
          path: build/release/
          if-no-files-found: error

      # Command-line tool for testing the engine against a real VPS.
      - name: Build msboost-local-cli
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-X main.version=$env:VERSION" -o build/cli/msboost-local-cli.exe ./cmd/msboost-local-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: msboost-local-cli-windows-x64
          path: build/cli/
          if-no-files-found: error

  # A v* tag produces a draft release: the program zip, the same version's
  # source and their SHA-256. It is published by hand after the download and
  # virus-scan checks in docs/m3/README.md. The website offers the same three
  # files from its own download server.
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [engine, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MSBOOST-Local-${{ github.ref_name }}-win-x64
          path: package

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="MSBOOST-Local-${GITHUB_REF_NAME}"
          (cd package && zip -9 -r "../${name}-win-x64.zip" .)
          git archive --format=zip --prefix="${name}-source/" -o "${name}-source.zip" HEAD
          sha256sum "${name}-win-x64.zip" "${name}-source.zip" > SHA256SUMS.txt
          # docs/releases/<tag>.md if written, otherwise the template.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=docs/release-notes-template.md
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" "$notes" > notes.md
          gh release create "$GITHUB_REF_NAME" "${name}-win-x64.zip" "${name}-source.zip" SHA256SUMS.txt --draft --verify-tag --title "MSBOOST 本地版 ${GITHUB_REF_NAME}" --notes-file notes.md
